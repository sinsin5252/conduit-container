name: CI/CD Pipeline Conduit Container

on:

  push:
    branches: [ "featurebranch/deployment" ]

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  Test:
    name: Test 
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7
        with: 
          submodules: true

      - name: Build environment
        run: cp .env.example .env

      - name: Run conduit container compose
        run: docker compose -f docker-compose.yaml up -d

      - name: Check if conduit container is running
        run: docker compose -f docker-compose.yaml ps
      
      - name: Check if website is running
        run: curl --fail --retry 10 --retry-delay 3 http://localhost:8282

      - name: Check if conduit container is healthy
        run: |
          docker compose -f docker-compose.yaml exec database pg_isready
          docker compose -f docker-compose.yaml exec backend python manage.py shell -c "from django.db import connection; connection.ensure_connection(); print('Datenbankverbindung OK')"
          curl -i http://localhost:8282/api/user

      - name: Show logs if test fails
        if: failure()
        run: docker compose -f docker-compose.yaml logs 

  Build-and-Push:
    name: Build and push images to GHCR
    runs-on: ubuntu-latest
    needs: Test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Backend.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.actor }}/conduit-backend:latest
            ghcr.io/${{ github.actor }}/conduit-backend:${{ github.sha }}

      - name: Build & push frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Frontend.Dockerfile 
          push: true
          tags: |
            ghcr.io/${{ github.actor }}/conduit-frontend:latest
            ghcr.io/${{ github.actor }}/conduit-frontend:${{ github.sha }}
      
  Deploy:
    name: Deployment
    runs-on: ubuntu-latest
    needs: Test

    steps:
      - name: Deploy to V-Server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e

            cd ~/conduit-container

            BRANCH=$(git branch --show-current)

            if [ "$BRANCH" != "featurebranch/deployment" ]; then
              git checkout featurebranch/deployment
            fi
            
            git pull 
            git submodule update --init

            EXPECTED_IP='${{ secrets.VM_HOST }}'

            if [ ! -f .env ]; then
              echo "Fehler: .env existiert nicht!"
              cp .env.example .env
            fi

            CURRENT_IP=$(grep '^IP_ADDRESS_SERVER=' .env | tail -n 1 | cut -d '=' -f 2-)

            if [ "$CURRENT_IP" != "$EXPECTED_IP" ]; then
              echo "IP_ADDRESS_SERVER wird aktualisiert."
              sed -i "s|^IP_ADDRESS_SERVER=.*|IP_ADDRESS_SERVER=$EXPECTED_IP|" .env
            else
              echo "IP_ADDRESS_SERVER ist bereits korrekt."
            fi

            docker compose -f docker-compose.yaml up -d --pull always
            docker image prune -f
